
name: Build and deploy SRM Aerosan API

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/main_srm-aerosan-api.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Diagnosticar estructura del repositorio
        run: |
          echo "Commit ejecutado:"
          git rev-parse --short HEAD

          echo "Directorio actual:"
          pwd

          echo "Archivos de la raiz:"
          ls -la

          echo "Archivos de api:"
          ls -la api/

          echo "Verificando package.json:"
          test -f api/package.json && echo "EXISTE" || echo "NO EXISTE"

          echo "Verificando package-lock.json:"
          test -f api/package-lock.json && echo "EXISTE" || echo "NO EXISTE"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        working-directory: api
        run: npm ci --omit=dev

      - name: Preparar paquete
        working-directory: api
        run: zip -r ../release.zip .

      - name: Guardar paquete
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Descargar paquete
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7D810F75670B496491EBB9BD1E4FAF1A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B3F094D157104EDABE49C66E1E1F1E79 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_747188555D404A5DA4F2048E20E72321 }}

      - name: Publicar API en Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: srm-aerosan-api
          package: release.zip
