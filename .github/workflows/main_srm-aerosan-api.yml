
name: Deploy SRM Aerosan API

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias de la API
        working-directory: api
        run: npm ci --omit=dev

      - name: Verificar archivos de Azure Functions
        working-directory: api
        run: |
          test -f host.json
          test -f package.json
          test -f package-lock.json
          test -d src/functions
          echo "Estructura de la API correcta"

      - name: Crear paquete de despliegue
        working-directory: api
        run: zip -r "$GITHUB_WORKSPACE/release.zip" . -x "local.settings.json"

      - name: Guardar paquete
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Descargar paquete
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: .

      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_556058396BBD4FC1BFD64187176BCDC9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_205BC7D4E139472C864A619548810C47 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1E3D4489C4814059B6F68819E975655A }}

      - name: Publicar API en Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: srm-aerosan-api
          package: release.zip
          remote-build: true
